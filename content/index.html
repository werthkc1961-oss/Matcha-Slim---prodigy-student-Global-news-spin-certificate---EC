<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matcha Slim Ecuador</title>
</head>
<body>
    <div style="text-align: center; font-family: sans-serif; padding: 50px;">
        <h1>¡Felicidades!</h1>
        <p>Nuestro portal ofrece un descuento especial del 50% para Matcha Slim.</p>
        <p>Para obtener Matcha Slim, pincha el botón SPIN o deja tu solicitud abajo.</p>
        
        <form id="orderForm" style="margin-top: 30px;">
            <input type="text" name="name" placeholder="Nombre" required style="padding: 10px; margin: 5px;"><br>
            <input type="tel" name="phone" placeholder="Teléfono" required style="padding: 10px; margin: 5px;"><br>
            <button type="submit" style="padding: 10px 20px; background: red; color: white; border: none; font-size: 16px; margin-top: 10px; cursor: pointer;">DEJAR SOLICITUD</button>
        </form>
    </div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    var form = document.getElementById("orderForm");
    if (form) {
        form.addEventListener("submit", function(e) {
            e.preventDefault();
            var formData = new FormData(this);
           fetch('https://adcombo.com', {
                method: 'POST',
                body: formData
            }).then(function() {
                window.location.href = 'https://adcombo.com';
            }).catch(function() {
                window.location.href = 'https://adcombo.com';
            });
        });
    }
});
</script>
</body></html>
